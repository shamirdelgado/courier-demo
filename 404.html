<!doctype html>

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            /* Define aquí el nombre de tu repositorio si publicas como sitio de proyecto. */
            (() => {
                if (location.protocol === 'file:') return;
                const parts = location.pathname.split('/').filter(Boolean);
                const project =
                    location.hostname.endsWith('.github.io') &&
                    parts.length &&
                    !['index.html', '404.html', 'paginas'].includes(parts[0]);
                const dirs = location.pathname.endsWith('/')
                    ? parts.length
                    : Math.max(0, parts.length - 1);
                const base = document.createElement('base');
                const levels = Math.max(0, dirs - (project ? 1 : 0));
                base.setAttribute('href', levels ? '../'.repeat(levels) : './');
                document.head.prepend(base);
            })();
        </script>
